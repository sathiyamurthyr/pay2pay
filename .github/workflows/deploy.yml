name: Pay2Pay Production CI/CD Pipeline

on:
  push:
    branches:
      - main
      - prod
  workflow_dispatch:

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1: Build all 8 Next.js apps in parallel via matrix strategy
  # ─────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: "Build - ${{ matrix.app.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # Let all matrix jobs run even if one fails
      matrix:
        app:
          - { name: website,           port: 3001 }
          - { name: super-admin,       port: 3002 }
          - { name: admin,             port: 3003 }
          - { name: super-distributor, port: 3004 }
          - { name: distributor,       port: 3005 }
          - { name: retailer,          port: 3006 }
          - { name: share-pages,       port: 3007 }
          - { name: auth,              port: 3008 }

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: pay2pay-platform/package-lock.json

      - name: Install Monorepo Dependencies
        run: |
          cd pay2pay-platform
          npm ci --legacy-peer-deps

      - name: Build App
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.pay2pay.in' }}
          BACKEND_URL: ${{ secrets.BACKEND_URL || 'https://api.pay2pay.in' }}
          NODE_OPTIONS: "--max-old-space-size=3072"
        run: |
          cd pay2pay-platform/apps/${{ matrix.app.name }}
          npm run build

      - name: Package Standalone Build
        run: |
          APP_DIR="pay2pay-platform/apps/${{ matrix.app.name }}"
          STANDALONE="$APP_DIR/.next/standalone"
          APP_SUBDIR="$STANDALONE/apps/${{ matrix.app.name }}"

          # Copy .next/static and public into root standalone AND app subfolder
          mkdir -p "$STANDALONE/.next"
          cp -r "$APP_DIR/.next/static" "$STANDALONE/.next/static"
          if [ -d "$APP_SUBDIR" ]; then
            mkdir -p "$APP_SUBDIR/.next"
            cp -r "$APP_DIR/.next/static" "$APP_SUBDIR/.next/static"
          fi

          if [ -d "$APP_DIR/public" ]; then
            cp -r "$APP_DIR/public" "$STANDALONE/public"
            if [ -d "$APP_SUBDIR" ]; then
              cp -r "$APP_DIR/public" "$APP_SUBDIR/public"
            fi
          fi

          # Create root server.js entrypoint wrapper if monorepo nested server.js
          if [ -f "$APP_SUBDIR/server.js" ] && [ ! -f "$STANDALONE/server.js" ]; then
            cat > "$STANDALONE/server.js" << 'EOF'
          const path = require("path");
          process.chdir(path.join(__dirname, "apps/${{ matrix.app.name }}"));
          require("./apps/${{ matrix.app.name }}/server.js");
          EOF
          fi

          tar -czf "${{ matrix.app.name }}.tar.gz" -C "$STANDALONE" .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.app.name }}-build"
          path: "${{ matrix.app.name }}.tar.gz"
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2: Verify the Python backend installs and imports cleanly
  # ─────────────────────────────────────────────────────────────────────────
  verify-backend:
    name: Backend Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install gunicorn

      - name: Verify App Can Be Imported
        run: |
          cd backend
          python -c "from app.main import app; print('Backend import OK')"

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 3: Deploy ONLY after all matrix builds + backend verify pass
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: [build-frontend, verify-backend]
    environment: production

    steps:
      - name: Download All App Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Upload Builds to Server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "artifacts/"
          target: "/tmp/pay2pay-deploy/"

      - name: Deploy and Restart Services on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            DEPLOY_DIR="/tmp/pay2pay-deploy/artifacts"
            APPS_BASE="/home/ubuntu/pay2pay/platform/apps"
            BRANCH="${{ github.ref_name }}"

            declare -A APP_PORTS=(
              [website]=3001
              [super-admin]=3002
              [admin]=3003
              [super-distributor]=3004
              [distributor]=3005
              [retailer]=3006
              [share-pages]=3007
              [auth]=3008
            )

            echo "=== DEPLOYING PAY2PAY PLATFORM ($BRANCH) ==="
            for APP in "${!APP_PORTS[@]}"; do
              PORT="${APP_PORTS[$APP]}"
              ARCHIVE="$DEPLOY_DIR/${APP}-build/${APP}.tar.gz"
              TARGET="$APPS_BASE/$APP"

              if [ ! -f "$ARCHIVE" ]; then
                echo "WARNING: Skipping $APP — archive not found at $ARCHIVE"
                continue
              fi

              echo "--- Deploying $APP → port $PORT ---"
              rm -rf "$TARGET"
              mkdir -p "$TARGET"
              tar -xzf "$ARCHIVE" -C "$TARGET"

              # Write runtime env file for each app
              cat > "$TARGET/.env.production" <<EOF
            NODE_ENV=production
            PORT=$PORT
            HOSTNAME=0.0.0.0
            NEXT_PUBLIC_API_URL=https://api.pay2pay.in
            BACKEND_URL=http://127.0.0.1:8000
            EOF

              # Also write env to subfolder if monorepo nested
              if [ -d "$TARGET/apps/$APP" ]; then
                cp "$TARGET/.env.production" "$TARGET/apps/$APP/.env.production"
                mkdir -p "$TARGET/apps/$APP/.next"
                [ -d "$TARGET/.next/static" ] && cp -r "$TARGET/.next/static" "$TARGET/apps/$APP/.next/static"
                [ -d "$TARGET/public" ] && cp -r "$TARGET/public" "$TARGET/apps/$APP/public"
              fi

              # Identify runtime server file
              RUN_SCRIPT="$TARGET/server.js"
              RUN_CWD="$TARGET"
              if [ ! -f "$RUN_SCRIPT" ] && [ -f "$TARGET/apps/$APP/server.js" ]; then
                RUN_SCRIPT="$TARGET/apps/$APP/server.js"
                RUN_CWD="$TARGET/apps/$APP"
              fi

              # Restart or start PM2 process
              pm2 delete "p2p-$APP" > /dev/null 2>&1 || true
              PORT=$PORT HOSTNAME=0.0.0.0 pm2 start "$RUN_SCRIPT" --name "p2p-$APP" --cwd "$RUN_CWD" --env production
            done

            echo "=== UPDATING BACKEND ==="
            cd /home/ubuntu/pay2pay/backend
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            source venv/bin/activate
            pip install -r requirements.txt --quiet
            sudo systemctl restart pay2pay-backend

            echo "=== FINALISING ==="
            pm2 save
            sudo systemctl reload nginx
            rm -rf /tmp/pay2pay-deploy

            echo "SUCCESS: All services deployed."
