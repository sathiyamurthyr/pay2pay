name: Pay2Pay Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Backend Test & Lint Verification
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Frontend Build & Typecheck
        run: |
          cd frontend
          npm ci || npm install --legacy-peer-deps
          npm run build

      - name: Deploy to Remote Production VPS (129.225.91.190)
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.SERVER_HOST || '129.225.91.190' }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: false
          script: |
            echo "=== 1. PULLING LATEST MAIN BRANCH ==="
            cd /home/ubuntu/pay2pay || cd ~/pay2pay
            git fetch origin main
            git reset --hard origin/main

            echo "=== 2. UPDATING BACKEND DEPENDENCIES ==="
            cd /home/ubuntu/pay2pay/backend || cd ~/pay2pay/backend
            if [ -d "venv" ]; then
              source venv/bin/activate
              pip install -r requirements.txt || true
            fi

            echo "=== 3. BUILDING FRONTEND NEXT.JS ==="
            cd /home/ubuntu/pay2pay/frontend || cd ~/pay2pay/frontend
            npm install --legacy-peer-deps
            NODE_OPTIONS="--max-old-space-size=1536" npx next build
            mkdir -p .next/standalone/.next/
            cp -r .next/static .next/standalone/.next/ 2>/dev/null || true
            cp -r public .next/standalone/ 2>/dev/null || true

            echo "=== 4. RESTARTING PM2 SERVICES & NGINX ==="
            pm2 restart all || pm2 restart pay2pay-frontend || true
            sudo systemctl reload nginx 2>/dev/null || true

            echo "=== CI/CD DEPLOYMENT FINISHED ==="
