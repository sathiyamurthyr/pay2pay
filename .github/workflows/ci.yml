name: CI Validation (Dev & PR)

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - prod
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Changed Files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  test-backend:
    name: Backend CI (Tests & Lint)
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio anyio

      - name: Verify Backend Imports
        run: |
          cd backend
          python -c "from app.main import app; print('✅ Backend import OK')"

      - name: Run Pytest Suite
        env:
          PYTHONPATH: "."
        run: |
          cd backend
          python -m pytest tests/test_domain_payin_redirect.py tests/test_domain_isolation_and_announcements.py tests/test_company_menus_and_favorites.py -v

  build-frontend:
    name: Frontend CI (Build & Validate)
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Restore Next.js Cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: Build Next.js Standalone
        env:
          NEXT_PUBLIC_API_URL: "/api/v1"
          NODE_OPTIONS: "--max-old-space-size=3072"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          cd frontend
          npm run build

      - name: Package Standalone Artifact
        run: |
          APP_DIR="frontend"
          STANDALONE="$APP_DIR/.next/standalone"
          APP_SUBDIR="$STANDALONE/apps/retailer"
          mkdir -p "$STANDALONE/.next" "$APP_SUBDIR/.next"
          cp -r "$APP_DIR/.next/static" "$STANDALONE/.next/static" || true
          cp -r "$APP_DIR/.next/static" "$APP_SUBDIR/.next/static" || true
          cp -r "$APP_DIR/public" "$STANDALONE/public" || true
          cp -r "$APP_DIR/public" "$APP_SUBDIR/public" || true
          if [ -f "$STANDALONE/server.js" ]; then
            cp "$STANDALONE/server.js" "$APP_SUBDIR/server.js"
          fi
          if [ -d "$STANDALONE/.next/server" ]; then
            mkdir -p "$APP_SUBDIR/.next/server"
            cp -r "$STANDALONE/.next/server" "$APP_SUBDIR/.next/"
          fi
          for item in "$STANDALONE/.next"/*; do
            if [ -f "$item" ]; then
              cp "$item" "$APP_SUBDIR/.next/"
            fi
          done
          cd "$STANDALONE"
          tar -czf ../../../retailer_standalone.tar.gz .
          echo "✅ Built retailer_standalone.tar.gz"

      - name: Upload Validated Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: retailer-standalone-bundle
          path: retailer_standalone.tar.gz
          retention-days: 7
