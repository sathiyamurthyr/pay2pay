name: Production Deployment — Retailer App (near4you.store)

on:
  push:
    branches:
      - prod
      - main
    paths:
      - 'pay2pay-platform/apps/retailer/**'
      - 'backend/**'
      - '.github/workflows/deploy-retailer-production.yml'
  workflow_dispatch:

concurrency:
  group: production-near4you-retailer
  cancel-in-progress: false

jobs:
  validate-and-build:
    name: Build & Package Retailer App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: pay2pay-platform/package-lock.json

      - name: Install Monorepo Dependencies
        run: |
          cd pay2pay-platform
          npm ci --legacy-peer-deps

      - name: Build Retailer Frontend for near4you.store
        env:
          NEXT_PUBLIC_API_URL: "/api/v1"
          NODE_OPTIONS: "--max-old-space-size=3072"
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          cd pay2pay-platform/apps/retailer
          npm run build

      - name: Assemble Standalone Bundle
        run: |
          APP_DIR="pay2pay-platform/apps/retailer"
          STANDALONE="$APP_DIR/.next/standalone"
          APP_SUBDIR="$STANDALONE/apps/retailer"
          mkdir -p "$STANDALONE/.next" "$APP_SUBDIR/.next"
          cp -r "$APP_DIR/.next/static" "$STANDALONE/.next/static" || true
          cp -r "$APP_DIR/.next/static" "$APP_SUBDIR/.next/static" || true
          cp -r "$APP_DIR/public" "$STANDALONE/public" || true
          cp -r "$APP_DIR/public" "$APP_SUBDIR/public" || true
          cd "$STANDALONE"
          tar -czf ../../../retailer_standalone.tar.gz .
          echo "✅ Built retailer_standalone.tar.gz"

      - name: Upload Retailer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: retailer-standalone-bundle
          path: pay2pay-platform/apps/retailer_standalone.tar.gz
          retention-days: 7

  deploy-to-vps:
    name: Deploy to Production VPS
    needs: validate-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Built Artifact
        uses: actions/download-artifact@v4
        with:
          name: retailer-standalone-bundle
          path: ./

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Sync Backend & Frontend to VPS
        env:
          HOST: ${{ secrets.VPS_SSH_HOST || '157.20.172.186' }}
          PORT: ${{ secrets.VPS_SSH_PORT || '55002' }}
          USER: ${{ secrets.VPS_SSH_USER || 'sathiya' }}
        run: |
          echo "==> Transferring frontend bundle to VPS..."
          scp -P $PORT -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no retailer_standalone.tar.gz $USER@$HOST:/tmp/retailer_standalone.tar.gz

          echo "==> Deploying on VPS..."
          ssh -p $PORT -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no $USER@$HOST << 'EOF'
            set -e
            DEPLOY_DIR="/opt/near4you-retailer"
            sudo mkdir -p "$DEPLOY_DIR/frontend" "$DEPLOY_DIR/backend"
            
            # Unpack frontend bundle
            sudo tar -xzf /tmp/retailer_standalone.tar.gz -C "$DEPLOY_DIR/frontend/"
            sudo rm -f /tmp/retailer_standalone.tar.gz
            
            # Restart only the dedicated near4you-retailer compose project
            cd "$DEPLOY_DIR"
            sudo docker compose build --pull
            sudo docker compose up -d --remove-orphans
            
            # Health check validation
            sleep 10
            curl -fsS http://127.0.0.1:8090/openapi.json > /dev/null && echo "✅ Backend OK"
            wget -q --spider http://127.0.0.1:3060/ && echo "✅ Frontend OK"
          EOF
