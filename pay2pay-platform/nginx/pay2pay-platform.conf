# Production Nginx Domain Routing Configuration for Pay2Pay Monorepo Platform

# HTTP -> HTTPS Global Redirect
server {
    listen 80;
    server_name pay2pay.in www.pay2pay.in super.pay2pay.in admin.pay2pay.in sd.pay2pay.in dist.pay2pay.in ret.pay2pay.in share.pay2pay.in auth.pay2pay.in api.pay2pay.in;
    return 301 https://$host$request_uri;
}

# 1. Main Website (https://pay2pay.in)
server {
    listen 443 ssl;
    http2 on;
    server_name pay2pay.in www.pay2pay.in;

    ssl_certificate /etc/letsencrypt/live/pay2pay.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pay2pay.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    ssl_buffer_size 4k;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

